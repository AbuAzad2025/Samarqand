name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SETTINGS_MODULE: contracting_site.settings.dev
      SECRET_KEY: django-insecure-ci-test-key-abcdefghijklmnopqrstuvwxyz0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff black mypy django-stubs

      - name: Ruff
        run: python -m ruff check .

      - name: Black
        run: python -m black --check .

      - name: Mypy
        run: python -m mypy --show-error-codes .

      - name: Django system check
        run: python -m django check --settings=contracting_site.settings.dev

      - name: Django deploy check
        run: python -m django check --deploy --settings=contracting_site.settings.dev

      - name: Check migrations
        run: python -m django makemigrations --check --settings=contracting_site.settings.dev

      - name: Run tests
        run: python manage.py test --settings=contracting_site.settings.dev

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/samarqand
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/samarqand/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
