services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: samarqand
      POSTGRES_USER: samarqand
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Not published to the host; reachable only on the compose network.

  web:
    build: .
    environment:
      DJANGO_SETTINGS_MODULE: contracting_site.settings.prod
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in your environment}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-}
      DB_ENGINE: postgres
      DB_NAME: samarqand
      DB_USER: samarqand
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your environment}
      DB_HOST: db
      DB_PORT: 5432
      SERVE_MEDIA: "false"
      AUTO_MIGRATE: "false"
      # Containers keep the published port; bare-metal deployments use the
      # app's private Unix socket (the gunicorn config default).
      GUNICORN_BIND: "0.0.0.0:8000"
    ports:
      - "8000:8000"
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn -c contracting_site/gunicorn.conf.py contracting_site.wsgi:application"

volumes:
  postgres_data:
