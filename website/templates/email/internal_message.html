<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f4f4f4;font-family:'Segoe UI',Tahoma,sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f4;padding:20px;">
<tr><td align="center">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);">
<tr><td style="background:linear-gradient(135deg,#007A3D,#0B0F19,#CE1126);padding:24px;text-align:center;">
<h1 style="margin:0;color:#fff;font-size:20px;">سمرقند للمقاولات</h1>
<p style="margin:4px 0 0;color:rgba(255,255,255,.7);font-size:13px;">نظام المراسلات الداخلي</p>
</td></tr>
<tr><td style="padding:24px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
<tr><td style="padding:8px 0;color:#666;font-size:13px;border-bottom:1px solid #eee;">
<strong>المرسل:</strong> {{ sender_name }} &lt;{{ sender_email }}&gt;
</td></tr>
<tr><td style="padding:8px 0;color:#666;font-size:13px;border-bottom:1px solid #eee;">
<strong>الموضوع:</strong> {{ subject }}
</td></tr>
<tr><td style="padding:16px 0;color:#333;font-size:14px;line-height:1.8;white-space:pre-wrap;">{{ body }}</td></tr>
</table>
</td></tr>
<tr><td style="background:#f8f8f8;padding:16px 24px;text-align:center;border-top:1px solid #eee;">
<p style="margin:0;color:#999;font-size:12px;">هذه الرسالة مرسلة من نظام سمرقند للمقاولات — المراسلات الداخلي</p>
</td></tr>
</table>
</td></tr></table>
</body>
</html>
